name: Improving
options:
  bundleIdPrefix: com.improving.health
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopBLE:
    path: Packages/WhoopBLE
  AppleWatchReader:
    path: Packages/AppleWatchReader

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Improving:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ImprovingApp/Sources
      - path: ImprovingApp/Resources/Fonts
        buildPhase: resources
      - path: ImprovingApp/Resources/Images
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.improving.health.ios
        PRODUCT_NAME: Improving
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ImprovingApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ImprovingApp/Resources/Improving.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    dependencies:
      - package: WhoopProtocol
      - package: WhoopBLE
      - package: AppleWatchReader

  ImprovingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ImprovingTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.improving.health.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Improving
      - package: WhoopProtocol
      - package: WhoopBLE
      - package: AppleWatchReader
