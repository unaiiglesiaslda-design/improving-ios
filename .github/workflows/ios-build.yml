name: iOS Build & Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS Unit Tests
        run: |
          DEST=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Using Simulator ID: $DEST"
          xcodebuild test \
            -project Improving.xcodeproj \
            -scheme Improving \
            -destination "platform=iOS Simulator,id=$DEST" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned Release .app & Package .ipa
        run: |
          xcodebuild build \
            -project Improving.xcodeproj \
            -scheme Improving \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP_PATH=$(find build/DerivedData -name "Improving.app" -type d | head -n 1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Improving.app
          cd build && zip -r Improving-ios-unsigned.ipa Payload

      - name: Upload Unsigned .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Improving-ios-unsigned
          path: build/Improving-ios-unsigned.ipa
