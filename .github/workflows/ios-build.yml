name: iOS Build & Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Shortcuts/**'
      - '.github/workflows/sign-shortcuts.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'Shortcuts/**'
      - '.github/workflows/sign-shortcuts.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Cache XcodeGen & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-xcodegen-spm-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcodegen-spm-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS Unit Tests
        run: |
          DEST_ID=$(xcodebuild -showdestinations -project Improving.xcodeproj -scheme Improving 2>/dev/null | grep "platform:iOS Simulator" | grep "iPhone" | grep -v "placeholder" | head -n 1 | sed -E 's/.*id:([^, }]+).*/\1/')
          echo "Detected Simulator ID: $DEST_ID"
          if [ -z "$DEST_ID" ]; then
            echo "ERROR: No iOS Simulator found — failing build instead of silently skipping tests!"
            exit 1
          fi
          xcodebuild test \
            -project Improving.xcodeproj \
            -scheme Improving \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run WhoopProtocol Swift Package Tests
        run: |
          swift test --package-path Packages/WhoopProtocol

      - name: Build Unsigned Release .app & Package .ipa
        run: |
          xcodebuild build \
            -project Improving.xcodeproj \
            -scheme Improving \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP_PATH=$(find build/DerivedData -name "Improving.app" -type d | head -n 1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Improving.app
          cd build && zip -r Improving-ios-unsigned.ipa Payload

      - name: Upload Unsigned .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Improving-ios-unsigned
          path: build/Improving-ios-unsigned.ipa
